version: "3.9"

services:
  mutante-core-api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: mutante_api_engine
    restart: unless-stopped
    ports:
      - "${PORT:-8000}:8000"
    env_file:
      - .env
    environment:
      - PORT=8000
      - KNOWLEDGE_SCAN_INTERVAL_SEC=60
      - DEFAULT_GEMINI_MODEL=gemini-2.5-flash
    volumes:
      - ./02_CONHECIMENTO:/app/02_CONHECIMENTO
      - ./api_mutante/data:/app/api_mutante/data
      - ./api_mutante/prompts:/app/api_mutante/prompts
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 1024M
        reservations:
          cpus: "0.5"
          memory: 256M
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
