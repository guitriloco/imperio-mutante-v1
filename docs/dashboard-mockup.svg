<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700" role="img" aria-labelledby="title desc">
  <title id="title">Mockup ilustrativo do dashboard Império Mutante</title>
  <desc id="desc">Interface escura com cabeçalho, navegação para Estúdio de Prompts, Base de Conhecimento e Chat RAG, e painel demonstrativo.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#050505"/><stop offset="1" stop-color="#101718"/></linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#00ff66"/><stop offset="1" stop-color="#00e5ff"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="12" stdDeviation="18" flood-color="#000" flood-opacity=".35"/></filter>
  </defs>
  <rect width="1200" height="700" rx="24" fill="url(#bg)"/>
  <rect x="22" y="22" width="1156" height="656" rx="18" fill="#090c0c" stroke="#26312e" filter="url(#shadow)"/>
  <rect x="23" y="23" width="1154" height="66" rx="17" fill="#101414"/>
  <circle cx="58" cy="56" r="8" fill="#00ff66"/>
  <text x="80" y="63" fill="#f4f7f5" font-family="Arial,sans-serif" font-size="21" font-weight="700" letter-spacing="1">IMPÉRIO MUTANTE</text>
  <text x="1015" y="60" fill="#00e5ff" font-family="monospace" font-size="13">GEMINI · API ONLINE</text>
  <line x1="23" y1="90" x2="1177" y2="90" stroke="#26312e"/>
  <rect x="44" y="107" width="267" height="49" rx="9" fill="#102018" stroke="#00ff66"/>
  <text x="69" y="137" fill="#e9fff1" font-family="monospace" font-size="14" font-weight="700">01  PROMPTS STUDIO</text>
  <rect x="325" y="107" width="290" height="49" rx="9" fill="#111717" stroke="#283330"/>
  <text x="350" y="137" fill="#a9b5b0" font-family="monospace" font-size="14">02  BASE DE CONHECIMENTO</text>
  <rect x="629" y="107" width="235" height="49" rx="9" fill="#111717" stroke="#283330"/>
  <text x="654" y="137" fill="#a9b5b0" font-family="monospace" font-size="14">03  CHAT RAG</text>
  <text x="49" y="194" fill="#eff5f1" font-family="Arial,sans-serif" font-size="17" font-weight="700">Estúdio de prompts</text>
  <text x="49" y="218" fill="#7d8b85" font-family="Arial,sans-serif" font-size="12">Selecione um template, ajuste a instrução e teste uma geração.</text>
  <rect x="45" y="238" width="310" height="365" rx="12" fill="#101414" stroke="#27312e"/>
  <text x="68" y="273" fill="#dce6e0" font-family="monospace" font-size="13" font-weight="700">TEMPLATES</text>
  <rect x="66" y="292" width="268" height="61" rx="8" fill="#151d19" stroke="#345740"/>
  <text x="82" y="318" fill="#e5eee8" font-family="Arial,sans-serif" font-size="13" font-weight="700">Assistente de pesquisa</text>
  <text x="82" y="338" fill="#7e9085" font-family="monospace" font-size="10">Instrução de sistema configurável</text>
  <rect x="66" y="365" width="268" height="61" rx="8" fill="#121716" stroke="#26312e"/>
  <text x="82" y="391" fill="#cbd5cf" font-family="Arial,sans-serif" font-size="13">Resumo de documentos</text>
  <text x="82" y="411" fill="#7e9085" font-family="monospace" font-size="10">Template de exemplo</text>
  <text x="68" y="465" fill="#00e5ff" font-family="monospace" font-size="11">+ NOVO TEMPLATE</text>
  <rect x="378" y="238" width="777" height="365" rx="12" fill="#101414" stroke="#27312e"/>
  <text x="405" y="273" fill="#dce6e0" font-family="monospace" font-size="13" font-weight="700">TERMINAL DE GERAÇÃO</text>
  <text x="405" y="312" fill="#788680" font-family="monospace" font-size="11">INSTRUÇÃO DE SISTEMA</text>
  <rect x="405" y="325" width="720" height="46" rx="7" fill="#090c0c" stroke="#27312e"/>
  <text x="423" y="353" fill="#aab7b0" font-family="monospace" font-size="12">Responda de forma clara e objetiva...</text>
  <text x="405" y="402" fill="#788680" font-family="monospace" font-size="11">PROMPT</text>
  <rect x="405" y="415" width="720" height="77" rx="7" fill="#090c0c" stroke="#27312e"/>
  <text x="423" y="445" fill="#aab7b0" font-family="monospace" font-size="12">Explique como a busca contextual pode ajudar</text>
  <text x="423" y="466" fill="#aab7b0" font-family="monospace" font-size="12">a consultar uma base de conhecimento.</text>
  <rect x="405" y="510" width="191" height="43" rx="8" fill="url(#accent)"/>
  <text x="430" y="537" fill="#04110a" font-family="monospace" font-size="12" font-weight="700">EXECUTAR GERAÇÃO</text>
  <rect x="405" y="566" width="720" height="21" rx="6" fill="#0a0e0d"/>
  <text x="419" y="581" fill="#718079" font-family="monospace" font-size="10">Prévia conceitual — conteúdo e aparência podem variar conforme a versão.</text>
  <text x="49" y="644" fill="#63716a" font-family="monospace" font-size="11">MOCKUP ILUSTRATIVO · NÃO É UMA CAPTURA DE TELA DA APLICAÇÃO</text>
</svg>
